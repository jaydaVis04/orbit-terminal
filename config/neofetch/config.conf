# ORBIT — a compact spacecraft and real system information.
# Keep startup light: no package-manager scans or network lookups.
print_info() {
    prin "ORBIT  /  LOCAL SYSTEM"
    info title
    info underline
    info "System" distro
    info "Machine" model
    info "Kernel" kernel
    info "Uptime" uptime
    info "Shell" shell
    info "Terminal" term
    info "CPU" cpu
    info "Memory" memory
    prin
    info cols
}

image_backend="ascii"
image_source="${HOME}/.config/neofetch/ascii.txt"
ascii_colors=(6 5 7 8 3 13)
ascii_bold="off"
gap=4

# Colors follow Kitty's ORBIT ANSI palette.
colors=(6 8 8 5 8 7)
bold="off"
underline_enabled="on"
underline_char="─"
separator="  "
title_fqdn="off"

os_arch="off"
distro_shorthand="on"
kernel_shorthand="on"
uptime_shorthand="on"
shell_path="off"
shell_version="on"
cpu_brand="on"
cpu_speed="off"
cpu_cores="off"
cpu_temp="off"
memory_percent="on"
memory_unit="gib"
memory_display="off"

color_blocks="on"
block_range=(4 7)
block_width=3
block_height=1
col_offset="auto"
stdout="off"

# Neofetch 7 predates Apple Silicon's larger VM pages. Report physical RAM
# directly instead of its legacy 4 KiB-page usage calculation.
if [[ "$(uname -s)" == Darwin ]]; then
get_memory() {
    local bytes
    bytes="$(sysctl -n hw.memsize 2>/dev/null)"
    case "$bytes" in ''|*[!0-9]*) return ;; esac
    memory="$(awk -v bytes="$bytes" 'BEGIN { printf "%.0f GiB physical", bytes / 1073741824 }')"
}
fi
