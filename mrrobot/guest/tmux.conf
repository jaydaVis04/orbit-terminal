unbind C-b
set -g prefix M-a
bind M-a send-prefix
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -sg escape-time 10
set -g default-terminal tmux-256color
set -as terminal-features ',xterm*:RGB'
set -g status-style 'bg=#10070b,fg=#e6a4af'
set -g status-left '#[fg=#10070b,bg=#ff334f,bold] MRROBOT #[fg=#ff6b7f,bg=#10070b] #S '
set -g status-left-length 40
set -g status-right '#[fg=#ff6b7f]x86_64 #[fg=#a96570]│ %H:%M '
set -g window-status-format '#[fg=#a96570] #I #W '
set -g window-status-current-format '#[fg=#10070b,bg=#ff6b7f,bold] #I #W '
set -g pane-border-style 'fg=#4f202c'
set -g pane-active-border-style 'fg=#ff334f'
set -g message-style 'bg=#4f202c,fg=#ffd5dc'
set -g history-limit 20000
bind '|' split-window -h -c '#{pane_current_path}'
bind '-' split-window -v -c '#{pane_current_path}'
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
