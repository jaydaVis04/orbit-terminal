# ORBIT. Prefix: Option-A on macOS (Alt-A elsewhere).
unbind C-b
unbind M-b
set -g prefix M-a
set -g prefix2 None
bind M-a send-prefix

set -g mouse on
set -g history-limit 100000
set -g mode-keys vi
set -g status-keys vi
set -s escape-time 10
set -g focus-events on
set -g set-clipboard on
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -g detach-on-destroy off
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:clipboard:ccolour:cstyle:extkeys"
set -as terminal-features ",xterm-256color:RGB"
set -s extended-keys on
set -s extended-keys-format csi-u
set -g allow-passthrough on

# ORBIT: a violet flight deck and cyan active-window capsules.
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=#060914,fg=#9ca9ca"
set -g status-left-length 50
set -g status-right-length 80
set -g status-left "#[fg=#b39dff,bg=#060914]#[fg=#090d18,bg=#b39dff,bold]  ORBIT  /  #S #[fg=#b39dff,bg=#060914,nobold] "
set -g status-right "#[fg=#a0dcc1,bold]#{?client_prefix,⌥ A  ,}#[fg=#ffd18c]#{?window_zoomed_flag,󰁌 ZOOM  ,}#[fg=#53627e,nobold]│ #[fg=#9ca9ca]#h  #[fg=#7bdff6] %H:%M #[fg=#53627e]│ #[fg=#b8c5e4]%a %d %b "
setw -g window-status-separator " "
setw -g window-status-format "#[fg=#7f8daf,bg=#060914] #I #[fg=#9ca9ca]#W#{?window_bell_flag, !,} "
setw -g window-status-current-format "#[fg=#7bdff6,bg=#060914]#[fg=#090d18,bg=#7bdff6,bold] #I  #W #{?window_zoomed_flag,󰁌 ,}#[fg=#7bdff6,bg=#060914,nobold]"
setw -g window-status-activity-style "fg=#ffd18c,bg=#060914"
setw -g window-status-bell-style "fg=#ff7e9f,bg=#060914,bold"
set -g pane-border-style "fg=#26324d"
set -g pane-active-border-style "fg=#7bdff6"
set -g pane-border-lines single
set -g pane-border-indicators colour
set -g display-panes-colour "#53627e"
set -g display-panes-active-colour "#b39dff"
set -g message-style "bg=#26324d,fg=#d8e2ff"
set -g message-command-style "bg=#26324d,fg=#b39dff"
setw -g mode-style "bg=#b39dff,fg=#090d18,bold"
setw -g copy-mode-match-style "bg=#19233a,fg=#ffd18c"
setw -g copy-mode-current-match-style "bg=#7bdff6,fg=#090d18,bold"
set -g display-time 2000
set -g display-panes-time 1200
set -g visual-activity off
set -g bell-action none

# New windows/panes inherit the working directory.
bind c new-window -c "#{pane_current_path}"
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5
bind Tab last-window
bind r source-file ~/.tmux.conf \; display-message "ORBIT config reloaded · prefix ⌥ A"
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
