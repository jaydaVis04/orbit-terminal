# ORBIT — midnight space, icy light, and a white comet cursor.
font_family DepartureMono Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 13.0
modify_font cell_height 3px

background #090d18
foreground #d8e2ff
background_image ~/.config/terminal-themes/assets/orbit.png
background_image_layout cscaled
background_image_linear yes
background_tint 0.22
background_opacity 1.0
selection_background #34405f
selection_foreground #ffffff
url_color #7bdff6
color0 #10182a
color1 #ff7e9f
color2 #a0dcc1
color3 #ffd18c
color4 #89b4ff
color5 #b39dff
color6 #7bdff6
color7 #d8e2ff
color8 #53627e
color9 #ffa1b8
color10 #b3efd3
color11 #ffe3b8
color12 #b7c9ff
color13 #f6a6d5
color14 #b0f0ff
color15 #ffffff

# The visibly stretchy white block requested for cursor jumps.
cursor #ffffff
cursor_text_color #090d18
cursor_shape block
cursor_shape_unfocused hollow
cursor_beam_thickness 2.0
cursor_underline_thickness 2.5
cursor_blink_interval 0.65 ease-in-out
cursor_stop_blinking_after 12
cursor_trail 1
cursor_trail_decay 0.25 0.55
cursor_trail_start_threshold 1
cursor_trail_color #ffffff
shell_integration enabled no-cursor

window_padding_width 18
window_border_width 1
active_border_color #7bdff6
inactive_border_color #26324d
draw_minimal_borders yes
inactive_text_alpha 0.88
remember_window_size yes
initial_window_width 126c
initial_window_height 36c
enabled_layouts tall,stack,splits

# Orbital tabs: cyan flight deck, violet inactive capsules.
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_bar_min_tabs 1
tab_bar_margin_width 18.0
tab_bar_margin_height 6.0 6.0
tab_bar_background #060914
active_tab_background #7bdff6
active_tab_foreground #090d18
active_tab_font_style bold
inactive_tab_background #10182a
inactive_tab_foreground #9ca9ca
inactive_tab_font_style normal
tab_title_template "  {index}  {title}  "
active_tab_title_template "   {index}  {title}  "

scrollback_lines 20000
enable_audio_bell no
visual_bell_duration 0.0
bell_on_tab "● "
macos_titlebar_color background
macos_option_as_alt both
macos_quit_when_last_window_closed no

# Option-A stays free for tmux. Neovim keeps its multicursor keys.
map cmd+shift+, edit_config_file
map cmd+shift+r load_config_file
map cmd+enter new_window_with_cwd
map cmd+t new_tab_with_cwd
map cmd+shift+enter launch --cwd=current --location=vsplit
map cmd+shift+h neighboring_window left
map cmd+shift+l neighboring_window right

include mrrobot.conf
