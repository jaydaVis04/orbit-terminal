# Catppuccin Mocha. Prefix: Option-A on macOS (Alt-A elsewhere).
unbind C-b
unbind M-b
set -g prefix M-a
set -g prefix2 None
bind M-a send-prefix

set -g mouse on
set -g history-limit 100000
set -g mode-keys vi
set -g status-keys vi
set -s escape-time 10
set -g focus-events on
set -g set-clipboard on
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -g detach-on-destroy off
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:clipboard:ccolour:cstyle:extkeys"
set -as terminal-features ",xterm-256color:RGB"
set -s extended-keys on
set -s extended-keys-format csi-u
set -g allow-passthrough on

# Lavender session and peach active-window pills on a quiet status rail.
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=#181825,fg=#a6adc8"
set -g status-left-length 50
set -g status-right-length 80
set -g status-left "#[fg=#cba6f7,bg=#181825]#[fg=#1e1e2e,bg=#cba6f7,bold]  #S #[fg=#cba6f7,bg=#181825,nobold] "
set -g status-right "#{?client_prefix,#[fg=#1e1e2e,bg=#a6e3a1,bold] ⌥ A #[default] ,}#{?window_zoomed_flag,#[fg=#fab387]󰁌 ZOOM  ,}#[fg=#585b70]│ #[fg=#a6adc8]#h  #[fg=#94e2d5] %H:%M #[fg=#585b70]│ #[fg=#bac2de]%a %d %b "
setw -g window-status-separator " "
setw -g window-status-format "#[fg=#6c7086,bg=#181825] #I #[fg=#a6adc8]#W#{?window_bell_flag, !,} "
setw -g window-status-current-format "#[fg=#fab387,bg=#181825]#[fg=#1e1e2e,bg=#fab387,bold] #I  #W #{?window_zoomed_flag,󰁌 ,}#[fg=#fab387,bg=#181825,nobold]"
setw -g window-status-activity-style "fg=#f9e2af,bg=#181825"
setw -g window-status-bell-style "fg=#f38ba8,bg=#181825,bold"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#b4befe"
set -g pane-border-lines single
set -g pane-border-indicators colour
set -g display-panes-colour "#585b70"
set -g display-panes-active-colour "#cba6f7"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cba6f7"
setw -g mode-style "bg=#cba6f7,fg=#1e1e2e,bold"
setw -g copy-mode-match-style "bg=#45475a,fg=#f9e2af"
setw -g copy-mode-current-match-style "bg=#fab387,fg=#1e1e2e,bold"
set -g display-time 2000
set -g display-panes-time 1200
set -g visual-activity off
set -g bell-action none

# New windows/panes inherit the working directory.
bind c new-window -c "#{pane_current_path}"
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5
bind Tab last-window
bind r source-file ~/.tmux.conf \; display-message "Mocha config reloaded · prefix ⌥ A"
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Session persistence. Appearance and navigation also work without TPM.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @resurrect-capture-pane-contents on
set -g @resurrect-processes "ssh mosh man less more tail top htop vim nvim node npm bun python python3"
set -g @continuum-restore on
set -g @continuum-save-interval 15
bind -n M-s if-shell 'test -x ~/.tmux/plugins/tmux-resurrect/scripts/save.sh' 'run-shell ~/.tmux/plugins/tmux-resurrect/scripts/save.sh' 'display-message "Install session plugins with prefix + I"'
bind -n M-r if-shell 'test -x ~/.tmux/plugins/tmux-resurrect/scripts/restore.sh' 'run-shell ~/.tmux/plugins/tmux-resurrect/scripts/restore.sh' 'display-message "Install session plugins with prefix + I"'
if-shell 'test -f ~/.tmux/plugins/tpm/tpm' 'run-shell ~/.tmux/plugins/tpm/tpm'
