# Catppuccin Mocha, coordinated with Neovim and tmux.
font_family DepartureMono Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 13.0
background #1e1e2e
foreground #cdd6f4
selection_background #585b70
selection_foreground #cdd6f4
url_color #89b4fa
color0 #45475a
color1 #f38ba8
color2 #a6e3a1
color3 #f9e2af
color4 #89b4fa
color5 #f5c2e7
color6 #94e2d5
color7 #bac2de
color8 #585b70
color9 #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8

# A visible white block with a slow, stretchy trail. Neovim controls its mode shapes.
cursor #ffffff
cursor_text_color #1e1e2e
cursor_shape block
cursor_shape_unfocused hollow
cursor_underline_thickness 2.5
cursor_beam_thickness 1.8
cursor_blink_interval 0.65 ease-in-out
cursor_stop_blinking_after 12
cursor_trail 1
cursor_trail_decay 0.25 0.55
cursor_trail_start_threshold 1
cursor_trail_color #ffffff
shell_integration enabled no-cursor

window_padding_width 12
window_border_width 1
draw_minimal_borders yes
active_border_color #b4befe
inactive_border_color #313244
background_opacity 1.0
remember_window_size yes
initial_window_width 120c
initial_window_height 34c
enabled_layouts tall,stack,splits
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_bar_min_tabs 2
tab_bar_margin_width 8.0
tab_bar_margin_height 4.0 4.0
tab_bar_background #181825
active_tab_background #cba6f7
active_tab_foreground #1e1e2e
active_tab_font_style bold
inactive_tab_background #313244
inactive_tab_foreground #a6adc8
inactive_tab_font_style normal
tab_title_template " {index}: {title} "
scrollback_lines 20000
enable_audio_bell no
visual_bell_duration 0.0
bell_on_tab "● "
macos_titlebar_color background
macos_option_as_alt both
macos_quit_when_last_window_closed no

# Option-A reaches tmux; Option-Shift-arrows reach Neovim.
map cmd+shift+, edit_config_file
map cmd+shift+r load_config_file
map cmd+enter new_window_with_cwd
map cmd+t new_tab_with_cwd
map cmd+shift+enter launch --cwd=current --location=vsplit
map cmd+shift+h neighboring_window left
map cmd+shift+l neighboring_window right
