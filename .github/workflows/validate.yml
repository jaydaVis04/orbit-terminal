name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/check_privacy.py
      - run: bash -n config/neofetch/config.conf vendor/neofetch/neofetch mrrobot/guest/provision.sh mrrobot/guest/verify.sh mrrobot/guest/bashrc
